<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Placement Prep Tracker — Paras</title>
<style>
/* ============================================================
   PLACEPREP — PREMIUM DARK THEME
   Palette: bg #0F172A · cards #1E293B · accent #22C55E
   ============================================================ */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{
  --bg:#0F172A; --bg2:#0B1222; --card:#1E293B; --card2:#243349;
  --accent:#22C55E; --accent2:#16A34A; --accent-soft:rgba(34,197,94,.14);
  --amber:#F59E0B; --amber-soft:rgba(245,158,11,.14);
  --blue:#38BDF8; --violet:#A78BFA; --rose:#FB7185;
  --text:#E2E8F0; --muted:#94A3B8; --faint:#64748B;
  --border:rgba(148,163,184,.14); --r:18px;
  --shadow:0 8px 30px rgba(2,6,23,.45);
  --easy:#22C55E; --med:#F59E0B; --hard:#F43F5E;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:radial-gradient(1200px 700px at 85% -10%,rgba(34,197,94,.07),transparent 60%),radial-gradient(900px 600px at -10% 110%,rgba(56,189,248,.06),transparent 55%),var(--bg);color:var(--text);min-height:100vh;font-size:14.5px;line-height:1.55;overflow-x:hidden}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#334155;border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:#475569}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ---------- Layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{width:248px;flex-shrink:0;background:rgba(15,23,42,.85);backdrop-filter:blur(14px);border-right:1px solid var(--border);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 14px;z-index:40}
.logo{display:flex;align-items:center;gap:11px;padding:4px 10px 20px;font-weight:800;font-size:19px;letter-spacing:-.3px}
.logo .mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#0EA5E9);display:grid;place-items:center;font-size:19px;box-shadow:0 4px 14px rgba(34,197,94,.35)}
.logo small{display:block;font-size:10.5px;font-weight:500;color:var(--muted);letter-spacing:.4px}
.nav{display:flex;flex-direction:column;gap:4px;flex:1}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:13px;color:var(--muted);font-weight:600;font-size:14px;transition:all .22s ease;text-align:left;width:100%}
.nav button .ic{font-size:17px;width:22px;text-align:center}
.nav button:hover{background:rgba(148,163,184,.08);color:var(--text);transform:translateX(3px)}
.nav button.active{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px rgba(34,197,94,.25)}
.side-foot{padding:12px 10px 2px;border-top:1px solid var(--border);font-size:12px;color:var(--faint)}
.side-foot .lvl-chip{display:flex;align-items:center;gap:10px;margin-bottom:8px;color:var(--text);font-weight:600;font-size:13px}
.side-foot .bar{height:6px;background:#0f1a2e;border-radius:6px;overflow:hidden}
.side-foot .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#4ADE80);border-radius:6px;transition:width .6s cubic-bezier(.22,1,.36,1)}

.main{flex:1;min-width:0;padding:26px 30px 60px;max-width:1180px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.topbar h1{font-size:23px;font-weight:800;letter-spacing:-.4px}
.topbar .sub{color:var(--muted);font-size:13px;margin-top:2px}
.top-chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px;box-shadow:var(--shadow)}
.chip .ico{font-size:15px}

/* ---------- Cards ---------- */
.card{background:linear-gradient(160deg,rgba(255,255,255,.035),rgba(255,255,255,0) 45%),var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.glass{backdrop-filter:blur(8px)}
.hoverable{transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
.hoverable:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(2,6,23,.6);border-color:rgba(34,197,94,.3)}
.grid{display:grid;gap:16px}
.g5{grid-template-columns:repeat(5,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:26px 0 13px}
.sec-title h2{font-size:16.5px;font-weight:800;letter-spacing:-.2px;display:flex;align-items:center;gap:9px}
.sec-title .more{color:var(--accent);font-weight:600;font-size:13px}

/* stat cards */
.stat{padding:17px 18px;position:relative;overflow:hidden}
.stat .k{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.3px;display:flex;align-items:center;gap:7px}
.stat .v{font-size:27px;font-weight:800;margin-top:5px;letter-spacing:-.6px}
.stat .d{font-size:11.5px;color:var(--faint);margin-top:3px}
.stat::after{content:'';position:absolute;right:-22px;top:-22px;width:82px;height:82px;border-radius:50%;background:var(--accent-soft);opacity:.6}
.stat.amber::after{background:var(--amber-soft)}
.stat.blue::after{background:rgba(56,189,248,.12)}
.stat.violet::after{background:rgba(167,139,250,.12)}
.stat.rose::after{background:rgba(251,113,133,.12)}

/* progress bars */
.pbar{height:9px;background:#0f1a2e;border-radius:8px;overflow:hidden;position:relative}
.pbar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--accent2),var(--accent) 60%,#4ADE80);width:0;transition:width 1s cubic-bezier(.22,1,.36,1);position:relative}
body.anim .pbar i::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);transform:translateX(-100%);animation:shimmer 2.4s infinite}
@keyframes shimmer{100%{transform:translateX(100%)}}
.pbar.thin{height:6px}

/* subject rows */
.subj-row{display:flex;align-items:center;gap:14px;padding:11px 6px;border-bottom:1px solid var(--border);cursor:pointer;border-radius:10px;transition:background .2s}
.subj-row:hover{background:rgba(148,163,184,.05)}
.subj-row:last-child{border-bottom:none}
.subj-row .ic{width:38px;height:38px;border-radius:11px;background:var(--card2);display:grid;place-items:center;font-size:18px;flex-shrink:0}
.subj-row .nm{font-weight:700;font-size:13.5px}
.subj-row .meta{font-size:11.5px;color:var(--muted)}
.subj-row .mid{flex:1;min-width:0}
.subj-row .pct{font-weight:800;font-size:14px;width:44px;text-align:right}

/* topic list */
.topic{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);background:rgba(15,23,42,.4);border-radius:14px;margin-bottom:9px;transition:all .22s ease}
.topic:hover{border-color:rgba(148,163,184,.3);transform:translateX(3px)}
.topic .st{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:15px;flex-shrink:0;cursor:pointer;border:2px solid var(--border);background:#0f1a2e;transition:all .25s ease;user-select:none}
.topic .st:hover{transform:scale(1.12)}
.topic .st.s1{border-color:var(--amber);background:var(--amber-soft)}
.topic .st.s2{border-color:var(--accent);background:var(--accent-soft)}
.topic .body{flex:1;min-width:0}
.topic .t-name{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.topic .t-sub{font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.topic.mastered .t-name{color:var(--accent)}
.hot{background:var(--amber-soft);color:var(--amber);font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;letter-spacing:.4px}
.tagc{background:rgba(56,189,248,.1);color:var(--blue);font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px}
.mini-btn{font-size:11px;font-weight:700;padding:4px 9px;border-radius:8px;background:var(--card2);color:var(--muted);border:1px solid var(--border);transition:all .2s}
.mini-btn:hover{color:var(--text);border-color:var(--faint)}
.mini-btn.on{color:var(--accent);border-color:rgba(34,197,94,.4);background:var(--accent-soft)}

/* problems */
.prob{display:flex;align-items:center;gap:12px;padding:11px 13px;border-bottom:1px solid var(--border)}
.prob:last-child{border-bottom:none}
.prob .st{width:26px;height:26px;border-radius:8px;border:2px solid var(--border);background:#0f1a2e;display:grid;place-items:center;font-size:12px;cursor:pointer;flex-shrink:0;transition:all .22s;user-select:none}
.prob .st:hover{transform:scale(1.15)}
.prob .st.s1{border-color:var(--amber);background:var(--amber-soft)}
.prob .st.s2{border-color:var(--accent);background:var(--accent);color:#052e12}
.prob .nm{font-weight:600;font-size:13px;flex:1;min-width:0}
.prob .nm .links{margin-left:8px;font-size:11px;font-weight:700}
.prob .nm .links a{margin-right:8px}
.diff{font-size:10.5px;font-weight:800;padding:2.5px 9px;border-radius:7px;letter-spacing:.3px;flex-shrink:0}
.diff.E{color:var(--easy);background:rgba(34,197,94,.12)}
.diff.M{color:var(--med);background:rgba(245,158,11,.12)}
.diff.H{color:var(--hard);background:rgba(244,63,94,.12)}
.rev-badge{font-size:10.5px;color:var(--violet);font-weight:700;background:rgba(167,139,250,.12);padding:2.5px 8px;border-radius:7px;flex-shrink:0}
.note-dot{width:7px;height:7px;border-radius:50%;background:var(--blue);flex-shrink:0}

/* folders */
.folder{padding:17px;cursor:pointer}
.folder .f-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.folder .f-ic{width:42px;height:42px;border-radius:12px;background:var(--card2);display:grid;place-items:center;font-size:20px}
.folder h3{font-size:14px;font-weight:700;margin-bottom:3px}
.folder .f-meta{font-size:11.5px;color:var(--muted);margin-bottom:9px}
.donut-mini{width:44px;height:44px;transform:rotate(-90deg)}
.donut-mini circle{fill:none;stroke-width:5}

/* tabs */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tabs button{padding:8px 16px;border-radius:11px;font-weight:700;font-size:13px;color:var(--muted);background:var(--card);border:1px solid var(--border);transition:all .2s}
.tabs button:hover{color:var(--text)}
.tabs button.active{background:var(--accent-soft);color:var(--accent);border-color:rgba(34,197,94,.35)}

/* heatmap */
.heatmap{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);gap:3.5px;overflow-x:auto;padding:6px 2px}
.hm-cell{width:13px;height:13px;border-radius:3.5px;background:#16223a;cursor:pointer;transition:transform .15s}
.hm-cell:hover{transform:scale(1.3);outline:1px solid var(--faint)}
.hm-cell.l1{background:#14532d}.hm-cell.l2{background:#166534}.hm-cell.l3{background:#16A34A}.hm-cell.l4{background:#22C55E}
.hm-cell.today{outline:2px solid var(--blue)}
.hm-legend{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--faint);justify-content:flex-end;margin-top:8px}
.hm-legend span{width:12px;height:12px;border-radius:3px;display:inline-block}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.cal-cell{aspect-ratio:1.15;border-radius:12px;background:#16223a;border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;transition:all .2s;font-size:12.5px;font-weight:600;color:var(--muted)}
.cal-cell:hover{transform:scale(1.06);border-color:var(--faint)}
.cal-cell.studied{background:var(--accent-soft);border-color:rgba(34,197,94,.4);color:var(--accent)}
.cal-cell.today{outline:2px solid var(--blue)}
.cal-cell.empty{visibility:hidden}
.cal-cell .xp-mini{font-size:9.5px;font-weight:700;color:var(--faint)}
.cal-cell.studied .xp-mini{color:var(--accent2)}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:8px;text-align:center;font-size:11px;font-weight:700;color:var(--faint);letter-spacing:.5px}

/* achievements */
.ach{display:flex;gap:14px;align-items:center;padding:16px}
.ach .a-ic{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-size:25px;background:var(--card2);flex-shrink:0;transition:all .3s}
.ach.unlocked .a-ic{background:linear-gradient(135deg,var(--accent-soft),rgba(34,197,94,.25));box-shadow:0 0 22px rgba(34,197,94,.25)}
.ach.locked{opacity:.5;filter:grayscale(.7)}
.ach h4{font-size:13.5px;font-weight:700}
.ach p{font-size:11.5px;color:var(--muted);margin-top:2px}
.ach .when{font-size:10.5px;color:var(--accent);font-weight:700;margin-top:3px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(2,6,23,.7);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal-bg.open{display:flex;animation:fadeIn .2s ease}
.modal{background:var(--card);border:1px solid var(--border);border-radius:20px;box-shadow:0 24px 70px rgba(0,0,0,.6);max-width:560px;width:100%;max-height:82vh;overflow-y:auto;padding:24px;animation:pop .28s cubic-bezier(.22,1.4,.36,1)}
@keyframes pop{from{transform:scale(.92) translateY(12px);opacity:0}}
@keyframes fadeIn{from{opacity:0}}
.modal h3{font-size:17px;font-weight:800;margin-bottom:4px}
.modal .m-sub{font-size:12.5px;color:var(--muted);margin-bottom:16px}
.modal textarea{width:100%;min-height:130px;background:#0f1a2e;border:1px solid var(--border);border-radius:12px;color:var(--text);padding:12px;font-family:inherit;font-size:13px;resize:vertical;outline:none}
.modal textarea:focus{border-color:rgba(34,197,94,.4)}
.m-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.btn{padding:9px 18px;border-radius:11px;font-weight:700;font-size:13px;transition:all .2s}
.btn.pri{background:var(--accent);color:#052e12}
.btn.pri:hover{background:#4ADE80;transform:translateY(-1px)}
.btn.ghost{background:var(--card2);color:var(--muted);border:1px solid var(--border)}
.btn.ghost:hover{color:var(--text)}
.btn.danger{background:rgba(244,63,94,.14);color:var(--rose);border:1px solid rgba(244,63,94,.3)}

/* toast */
#toasts{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--card);border:1px solid rgba(34,197,94,.35);border-left:4px solid var(--accent);border-radius:13px;padding:13px 18px;box-shadow:0 12px 34px rgba(0,0,0,.5);font-weight:600;font-size:13px;display:flex;gap:10px;align-items:center;animation:slideIn .35s cubic-bezier(.22,1.2,.36,1);max-width:340px}
.toast.xp{border-color:rgba(245,158,11,.4);border-left-color:var(--amber)}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}}
.toast.out{animation:slideOut .3s forwards}
@keyframes slideOut{to{transform:translateX(120%);opacity:0}}

/* analytics charts */
.hbar-row{display:flex;align-items:center;gap:12px;margin-bottom:11px}
.hbar-row .lbl{width:130px;font-size:12.5px;font-weight:600;color:var(--muted);text-align:right;flex-shrink:0}
.hbar-row .trk{flex:1;height:22px;background:#0f1a2e;border-radius:8px;overflow:hidden}
.hbar-row .trk i{display:block;height:100%;border-radius:8px;transition:width .9s cubic-bezier(.22,1,.36,1)}
.hbar-row .val{width:46px;font-size:12px;font-weight:800;flex-shrink:0}
.vbars{display:flex;align-items:flex-end;gap:14px;height:170px;padding:8px 4px 0}
.vbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end}
.vbar .col{width:100%;max-width:46px;background:linear-gradient(180deg,#4ADE80,var(--accent2));border-radius:8px 8px 3px 3px;transition:height .9s cubic-bezier(.22,1,.36,1);min-height:3px}
.vbar .vl{font-size:11px;font-weight:800;color:var(--accent)}
.vbar .xl{font-size:10.5px;color:var(--faint);font-weight:600}

/* company cards */
.comp{padding:0;overflow:hidden}
.comp .c-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;cursor:pointer;transition:background .2s}
.comp .c-head:hover{background:rgba(148,163,184,.05)}
.comp .c-name{font-weight:800;font-size:14.5px;display:flex;align-items:center;gap:10px}
.comp .c-body{display:none;padding:4px 18px 18px;border-top:1px solid var(--border)}
.comp.open .c-body{display:block;animation:fadeIn .25s}
.comp .qcat{margin-top:13px}
.comp .qcat h5{font-size:11px;font-weight:800;letter-spacing:.8px;color:var(--accent);text-transform:uppercase;margin-bottom:7px}
.comp .qcat li{font-size:12.8px;color:#CBD5E1;margin:5px 0 5px 16px;line-height:1.5}
.yr{font-size:10px;font-weight:800;padding:2.5px 8px;border-radius:6px;background:rgba(167,139,250,.14);color:var(--violet)}
.arrow{transition:transform .25s;color:var(--faint)}
.comp.open .arrow{transform:rotate(90deg)}

/* settings */
.set-row{display:flex;align-items:center;justify-content:space-between;padding:15px 0;border-bottom:1px solid var(--border)}
.set-row:last-child{border-bottom:none}
.set-row h4{font-size:13.5px;font-weight:700}
.set-row p{font-size:12px;color:var(--muted);margin-top:2px}
.switch{width:46px;height:26px;border-radius:999px;background:#0f1a2e;border:1px solid var(--border);position:relative;cursor:pointer;transition:background .25s;flex-shrink:0}
.switch::after{content:'';position:absolute;width:20px;height:20px;border-radius:50%;background:var(--faint);top:2px;left:3px;transition:all .25s}
.switch.on{background:var(--accent)}
.switch.on::after{left:22px;background:#fff}

/* readiness ring */
.ring-wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.ring{position:relative;width:150px;height:150px;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .center b{font-size:29px;font-weight:800;letter-spacing:-1px}
.ring .center span{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.4px}
.ring-breakdown{flex:1;min-width:200px}
.rb-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12px}
.rb-row .l{width:110px;color:var(--muted);font-weight:600}
.rb-row .pbar{flex:1}
.rb-row .p{width:36px;text-align:right;font-weight:800}

/* misc */
.empty{text-align:center;padding:36px 20px;color:var(--faint)}
.empty .big{font-size:38px;margin-bottom:10px}
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:14px;font-weight:600}
.crumb a{color:var(--muted);cursor:pointer}
.crumb a:hover{color:var(--accent);text-decoration:none}
.counter{font-variant-numeric:tabular-nums}
.activity-row{display:flex;gap:12px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--border);font-size:13px}
.activity-row:last-child{border-bottom:none}
.activity-row .a-ic{width:32px;height:32px;border-radius:10px;background:var(--card2);display:grid;place-items:center;font-size:15px;flex-shrink:0}
.activity-row .tm{font-size:11px;color:var(--faint);margin-top:1px}
#confetti-canvas{position:fixed;inset:0;pointer-events:none;z-index:500}
.searchbox{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:9px 14px;color:var(--text);font-family:inherit;font-size:13px;outline:none;width:250px}
.searchbox:focus{border-color:rgba(34,197,94,.4)}
.pill-count{background:var(--card2);border-radius:999px;font-size:11px;font-weight:800;padding:2px 9px;color:var(--muted)}
.mob-toggle{display:none}
.back-btn{display:none;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--border);font-size:20px;color:var(--text);transition:all .2s;flex-shrink:0}
.back-btn:hover{border-color:var(--accent);color:var(--accent);transform:translateX(-2px)}

@media(max-width:1000px){.g5{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){
  .sidebar{position:fixed;left:-260px;transition:left .3s ease;box-shadow:0 0 60px rgba(0,0,0,.6);z-index:60}
  .sidebar.open{left:0}
  .main{padding:18px 14px 60px}
  .g5,.g4,.g3,.g2{grid-template-columns:repeat(2,1fr)}
  .mob-toggle{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--card);border:1px solid var(--border);font-size:18px}
  .hbar-row .lbl{width:88px;font-size:11px}
  .topbar h1{font-size:19px}
  /* calendar month grid: tighter gaps, no min-width so 7 cols always fit */
  .cal-grid,.cal-head{gap:5px}
  .cal-cell{aspect-ratio:1;border-radius:9px;font-size:12px;gap:1px;min-width:0}
  .cal-cell .xp-mini{font-size:8px}
  .cal-head{font-size:9.5px;letter-spacing:.2px}
  /* heatmap scrolls horizontally inside its card without pushing page width */
  .heatmap{grid-template-rows:repeat(7,14px);gap:3px}
  .hm-cell{width:14px;height:14px}          /* keep taps comfortable */
  .card{padding:16px}
  .modal{padding:18px;border-radius:16px;max-height:86vh}
  .tabs button{padding:8px 13px}
  .mini-btn{padding:6px 11px;font-size:12px}  /* larger touch targets */
  .sec-title{flex-wrap:wrap;gap:8px}
}
@media(max-width:480px){
  .main{padding:16px 11px 56px}
  .g5,.g4{grid-template-columns:repeat(2,1fr)}
  .cal-grid,.cal-head{gap:4px}
  .cal-cell{border-radius:8px;font-size:11.5px}
  .cal-cell .xp-mini{display:none}          /* number stays; XP label hidden to prevent overflow */
  .cal-cell.studied{position:relative}
  .cal-cell.studied::after{content:'';position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
  .cal-head{font-size:8.5px}
  .heatmap{grid-template-rows:repeat(7,12px);gap:2.5px}
  .hm-cell{width:12px;height:12px}
  .topbar{gap:10px}
  .top-chips .chip{padding:6px 11px;font-size:12px}
  .searchbox{width:100%}
}
@media(max-width:360px){
  .cal-grid,.cal-head{gap:3px}
  .cal-cell{font-size:10.5px}
  .cal-head{font-size:7.5px;letter-spacing:0}
}

/* ============================================================
   CORE · STATE, PERSISTENCE, GAMIFICATION, UTILITIES
   ============================================================ */
const LS_KEY='placeprep.v1';
const clone=o=>(typeof structuredClone==='function')?structuredClone(o):JSON.parse(JSON.stringify(o)); // fallback for older browsers
const todayKey=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

const DEFAULT_STATE={
  topics:{},        // topicId -> {s:0|1|2, rev:number, note:string, masteredAt:ts}
  problems:{},      // slug   -> {s:0|1|2, rev:number, note:string, solvedAt:ts}
  xp:0,             // legacy field; kept for back-compat. Live XP is derived (see xpTotal)
  bonusXp:0,        // one-way rewards that reverts must NOT remove (revisions)
  xpMigrated:false, // guards the one-time migration of legacy flat XP into bonusXp
  achievements:{},  // achId -> timestamp
  days:{},          // 'YYYY-MM-DD' -> {xp:number, items:[label,...]}
  activity:[],      // [{t:timestamp, ic, label}] newest first (cap 60)
  settings:{animations:true, theme:'dark', idbMirror:true, autoExport:false, autoExportEvery:15}
};
let S=loadState();
let saveCount=0; // tracks milestones since last auto-export

/* ============================================================
   STORAGE RESILIENCE · IndexedDB mirror
   LocalStorage stays the primary (synchronous) store. On every
   save we also mirror to IndexedDB, which survives some cases
   where LocalStorage is cleared and offers a far larger quota.
   On boot, if LocalStorage is empty but IDB has data, we restore.
   ============================================================ */
const IDB_NAME='placeprep-db', IDB_STORE='state', IDB_KEY='current';
let _idb=null;
function idbOpen(){
  return new Promise((res,rej)=>{
    if(_idb) return res(_idb);
    if(!('indexedDB' in window)) return rej('no-idb');
    const req=indexedDB.open(IDB_NAME,1);
    req.onupgradeneeded=()=>{ const db=req.result; if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE); };
    req.onsuccess=()=>{ _idb=req.result; res(_idb); };
    req.onerror=()=>rej(req.error);
  });
}
async function idbPut(obj){
  try{ const db=await idbOpen();
    await new Promise((res,rej)=>{ const tx=db.transaction(IDB_STORE,'readwrite');
      tx.objectStore(IDB_STORE).put(JSON.stringify(obj),IDB_KEY);
      tx.oncomplete=res; tx.onerror=()=>rej(tx.error); });
  }catch(e){ /* IDB unavailable (private mode etc.) — LocalStorage still holds data */ }
}
async function idbGet(){
  try{ const db=await idbOpen();
    return await new Promise((res,rej)=>{ const tx=db.transaction(IDB_STORE,'readonly');
      const r=tx.objectStore(IDB_STORE).get(IDB_KEY);
      r.onsuccess=()=>res(r.result?JSON.parse(r.result):null); r.onerror=()=>rej(r.error); });
  }catch(e){ return null; }
}
/* Recover from the IDB mirror when LocalStorage was cleared but IDB survived. */
async function recoverFromMirror(){
  if(localStorage.getItem(LS_KEY)) return;              // LS already has data → nothing to do
  const mirrored=await idbGet();
  if(mirrored && ('xp' in mirrored)){
    S={...clone(DEFAULT_STATE), ...mirrored, settings:{...DEFAULT_STATE.settings, ...(mirrored.settings||{})}};
    if(!('bonusXp' in mirrored) || !('xpMigrated' in mirrored)) S.xpMigrated=false;
    migrateXp(); syncXp();
    localStorage.setItem(LS_KEY, JSON.stringify(S));     // rehydrate primary store
    document.body.classList.toggle('anim', S.settings.animations);
    render(); refreshChrome();
    toast('Recovered your progress from local backup','','♻️');
  }
}

function loadState(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(!raw) return clone(DEFAULT_STATE);
    const s=JSON.parse(raw);
    return {...clone(DEFAULT_STATE), ...s, settings:{...DEFAULT_STATE.settings, ...(s.settings||{})}};
  }catch(e){ return clone(DEFAULT_STATE); }
}
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }
  catch(e){ console.warn('LocalStorage save failed',e); toast('Browser storage is full or blocked — export a backup soon','','⚠️'); }
  if(S.settings.idbMirror) idbPut(S);   // async, non-blocking mirror
}
/* Called by milestone actions (mastering / solving) to trigger periodic auto-export. */
function maybeAutoExport(){
  if(!S.settings.autoExport) return;
  saveCount++;
  const every=Math.max(1, S.settings.autoExportEvery||15);
  if(saveCount>=every){ saveCount=0; exportData(true); }
}

/* ---------- Lookup helpers ---------- */
const ALL_TOPICS=SUBJECTS.flatMap(s=>s.topics.map(t=>({...t, subj:s.id, subjName:s.name})));
const TOPIC_BY_ID=Object.fromEntries(ALL_TOPICS.map(t=>[t.id,t]));
const DSA_PROBLEMS=DSA.flatMap(f=>f.problems.map(p=>({...p, folder:f.id, folderName:f.name})));
const PROB_META={}; // slug -> {n,d,lc,gfg} merged from dsa + sheets
DSA_PROBLEMS.forEach(p=>{ PROB_META[p.s]={n:p.n,d:p.d,lc:p.lc,gfg:p.gfg}; });
Object.values(SHEETS).forEach(sh=>sh.groups.forEach(g=>g[1].forEach(([n,d,slug])=>{
  if(!PROB_META[slug]) PROB_META[slug]={n,d,lc:LC+slug+'/',gfg:null};
})));
const tState=id=>S.topics[id]||{s:0,rev:0,note:''};
const pState=sl=>S.problems[sl]||{s:0,rev:0,note:''};

/* ---------- XP · Levels ----------
   XP is DERIVED from current state, not a permanent running total.
     earnedXp() = 20 per currently-mastered topic
                + difficulty value per currently-solved problem
     bonusXp    = one-way rewards (revisions) that reverting must NOT undo
   S.xp is kept as a cached mirror of the live total so old readers/UI still
   work, but it is always recomputed from state — it can never inflate. */
const xpForProblem=d=>d==='H'?30:d==='M'?20:10;
const XP_TOPIC=20, XP_REV=5;
function earnedXp(){
  let x=0;
  for(const id in S.topics){ if(S.topics[id].s===2) x+=XP_TOPIC; }
  for(const sl in S.problems){ if(S.problems[sl].s===2){ const m=PROB_META[sl]; x+=m?xpForProblem(m.d):XP_TOPIC; } }
  return x;
}
function xpTotal(){ return earnedXp()+(S.bonusXp||0); }
/* Recompute the cached S.xp from live state. Call after ANY status change. */
function syncXp(){ S.xp=xpTotal(); }

/* One-time migration for existing saves created before the derived-XP refactor.
   Their S.xp was a flat total that already included topic/problem awards AND
   revisions. We compute how much of the old total came from revisions and move
   only that into bonusXp, so the user's XP stays exactly the same after upgrade. */
function migrateXp(){
  if(S.xpMigrated) return;
  const base=earnedXp();
  const legacy=(typeof S.xp==='number')?S.xp:0;
  S.bonusXp=Math.max(0, legacy-base);   // leftover = revisions earned historically
  S.xpMigrated=true;
  syncXp();
}

function levelFromXp(xp){ let l=1; while(xp>=xpToReach(l+1)) l++; return l; }
function xpToReach(l){ return 60*(l-1)*l; }            // cumulative XP needed for level l
function levelProgress(){
  const total=S.xp, l=levelFromXp(total), lo=xpToReach(l), hi=xpToReach(l+1);
  return {level:l, pct:Math.min(100,Math.round((total-lo)/(hi-lo)*100)), cur:total-lo, need:hi-lo};
}

/* Called after a status change that MAY have changed earned XP.
   Recomputes the total, logs activity, fires level-up/achievements, persists. */
function applyXpChange(label, icon, deltaForToast){
  const before=levelFromXp(S.xp);
  syncXp();
  const after=levelFromXp(S.xp);
  if(label){
    const day=todayKey();
    if(!S.days[day]) S.days[day]={xp:0,items:[]};
    if(deltaForToast>0) S.days[day].xp+=deltaForToast;   // heatmap credits positive gains only
    S.days[day].items.unshift(label); S.days[day].items=S.days[day].items.slice(0,40);
    S.activity.unshift({t:Date.now(), ic:icon, label}); S.activity=S.activity.slice(0,60);
  }
  if(deltaForToast>0) toast(`+${deltaForToast} XP — ${label||'progress'}`, 'xp', '💎');
  else if(deltaForToast<0) toast(`${deltaForToast} XP — ${label||'reverted'}`, '', '↩️');
  if(after>before){ toast(`Level up! You reached Level ${after} ⭐`,'', '⭐'); confetti(); }
  checkAchievements(); save(); refreshChrome();
  if(deltaForToast>0) maybeAutoExport();
}
/* Award pure bonus XP (revisions) — a one-way action, tracked separately. */
function addBonusXp(amount, label, icon='✨'){
  S.bonusXp=(S.bonusXp||0)+amount;
  applyXpChange(label, icon, amount);
}
function logStudy(label, icon='📖'){ // activity without XP (e.g. set to Learning)
  const day=todayKey();
  if(!S.days[day]) S.days[day]={xp:0,items:[]};
  S.days[day].items.unshift(label); S.days[day].items=S.days[day].items.slice(0,40);
  S.activity.unshift({t:Date.now(), ic:icon, label}); S.activity=S.activity.slice(0,60);
  save(); refreshChrome();
}

/* ---------- Streaks ---------- */
function streaks(){
  const keys=Object.keys(S.days).filter(k=>S.days[k].items.length||S.days[k].xp>0).sort();
  const set=new Set(keys);
  let cur=0; const d=new Date();
  if(!set.has(todayKey(d))) d.setDate(d.getDate()-1); // streak survives until today is missed
  while(set.has(todayKey(d))){ cur++; d.setDate(d.getDate()-1); }
  let best=0,run=0,prev=null;
  keys.forEach(k=>{
    if(prev){ const diff=(new Date(k)-new Date(prev))/864e5; run=diff===1?run+1:1; }
    else run=1;
    best=Math.max(best,run); prev=k;
  });
  const now=new Date(), monthPrefix=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  return {cur, best, total:keys.length, month:keys.filter(k=>k.startsWith(monthPrefix)).length};
}

/* ---------- Progress calculators ---------- */
function subjectProgress(id){

const confettiC=document.getElementById('confetti-canvas'), ctx=confettiC.getContext('2d');
let confPieces=[], confRunning=false;
function confetti(){
  if(!S.settings.animations || !ctx) return;
  confettiC.width=innerWidth; confettiC.height=innerHeight;
  const colors=['#22C55E','#4ADE80','#F59E0B','#38BDF8','#A78BFA','#FB7185','#FACC15'];
  for(let i=0;i<130;i++) confPieces.push({
    x:innerWidth/2+(Math.random()-.5)*260, y:innerHeight*0.35,
    vx:(Math.random()-.5)*11, vy:-(Math.random()*11+4),
    w:Math.random()*8+4, h:Math.random()*5+3,
    c:colors[Math.floor(Math.random()*colors.length)],
    r:Math.random()*Math.PI, vr:(Math.random()-.5)*.3, life:110+Math.random()*50
  });
  if(!confRunning){ confRunning=true; requestAnimationFrame(confTick); }
}
function confTick(){
  if(!ctx) return;
  ctx.clearRect(0,0,confettiC.width,confettiC.height);
  confPieces=confPieces.filter(p=>p.life>0 && p.y<innerHeight+30);
  confPieces.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy; p.vy+=.32; p.vx*=.99; p.r+=p.vr; p.life--;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
    ctx.globalAlpha=Math.min(1,p.life/40); ctx.fillStyle=p.c;
    ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
  });
  if(confPieces.length){ requestAnimationFrame(confTick); } else { confRunning=false; ctx.clearRect(0,0,confettiC.width,confettiC.height); }
}

const ROUTES=[
 {id:'dashboard',ic:'🏠',n:'Dashboard'},
 {id:'subjects',ic:'📚',n:'Subjects'},
 {id:'dsa',ic:'🧠',n:'DSA Problems'},
 {id:'companies',ic:'🏢',n:'Companies'},

 {id:'achievements',ic:'🏅',n:'Achievements'},
 {id:'settings',ic:'⚙️',n:'Settings'},
];
let route={page:'dashboard'};

/* ============================================================
   ROUTING · History API integration
   The full route (page + any drill-down params) is serialized into
   the URL hash so: the phone/browser Back button walks the in-app
   history, refresh restores the exact view, and direct links work.
   go()      → pushState (new history entry)
   goReplace → replaceState (no new entry; used for in-page filters)

   Some sandboxed environments (e.g. an iframe with an `about:srcdoc`
   or opaque origin) throw SecurityError on pushState/replaceState.
   We feature-detect once and fall back to an in-memory history stack
   so navigation + the Back button keep working everywhere.
   ============================================================ */
const HISTORY_OK=(()=>{
  try{ history.replaceState(history.state, '', location.href); return true; }
  catch(e){ return false; }
})();
let _memStack=[{page:'dashboard'}];   // in-memory fallback history
function safeReplace(r){
  if(HISTORY_OK){ try{ history.replaceState({r}, '', routeToHash(r)); return; }catch(e){} }
  _memStack[_memStack.length-1]={...r};
}
function safePush(r){
  if(HISTORY_OK){ try{ history.pushState({r}, '', routeToHash(r)); return; }catch(e){} }
  _memStack.push({...r});
}
function safeBack(){
  if(HISTORY_OK && history.length>1){ history.back(); return true; }
  if(_memStack.length>1){ _memStack.pop(); route=_memStack[_memStack.length-1];
    document.getElementById('sidebar').classList.remove('open'); render(); scrollTo({top:0,behavior:'auto'}); return true; }
  return false;
}
function routeToHash(r){
  const p=new URLSearchParams();
  p.set('p', r.page);
  ['subj','folder','tab','yr'].forEach(k=>{ if(r[k]!==undefined && r[k]!=='' && r[k]!==0) p.set(k, r[k]); });
  if(r.q) p.set('q', r.q);
  return '#'+p.toString();
}
function hashToRoute(){
  let h='';
  try{ h=(location.hash||'').replace(/^#/,''); }catch(e){ h=''; }
  if(!h) return {page:'dashboard'};
  const p=new URLSearchParams(h);
  const page=p.get('p')||'dashboard';
  if(!ROUTES.some(r=>r.id===page)) return {page:'dashboard'};
  const r={page};
  ['subj','folder','tab','q'].forEach(k=>{ if(p.has(k)) r[k]=p.get(k); });
  if(p.has('yr')) r.yr=+p.get('yr')||0;
  return r;
}
function sameRoute(a,b){
  return a.page===b.page && a.subj===b.subj && a.folder===b.folder && a.tab===b.tab && (a.yr||0)===(b.yr||0) && (a.q||'')===(b.q||'');
}
function go(page, extra={}){
  const next={page, ...extra};
  document.getElementById('sidebar').classList.remove('open');
  if(sameRoute(next, route)){ return; }   // avoid duplicate history entries
  route=next;
  safePush(route);
  render(); scrollTo({top:0,behavior:'smooth'});
}
/* In-page changes (search text, year filter) update the URL without adding
   a history entry, so Back still leaves the section rather than undoing typing. */
function goReplace(extra={}){
  route={...route, ...extra};
  safeReplace(route);
  render();
}
/* Compute the logical parent of the current route for the in-app Back button. */
function parentRoute(){
  const r=route;
  if(r.page==='subjects' && r.subj) return {page:'subjects'};
  if(r.page==='dsa' && r.folder) return {page:'dsa', tab:'topics'};
  if(r.page==='dsa' && r.tab && r.tab!=='topics') return {page:'dsa', tab:'topics'};
  if(r.page!=='dashboard') return {page:'dashboard'};
  return null; // already at root
}
function goBack(){
  if(safeBack()) return;                 // used real or in-memory history
  const par=parentRoute(); if(par) go(par.page, par);   // last resort: logical parent
}
addEventListener('popstate', e=>{
  const r=(e.state&&e.state.r)?e.state.r:hashToRoute();
  route=r; document.getElementById('sidebar').classList.remove('open');
  render(); scrollTo({top:0,behavior:'auto'});
});

function heatmapHtml(weeks){
  const cells=[]; const today=new Date();
  const start=new Date(today); start.setDate(start.getDate()-(weeks*7-1)-start.getDay());
  for(let d=new Date(start); d<=today; d.setDate(d.getDate()+1)){
    const k=todayKey(d), day=S.days[k], xp=day?day.xp:0, n=day?day.items.length:0;
    const lvl=!day||(n===0&&xp===0)?0:xp>=80?4:xp>=40?3:xp>=15?2:1;
    cells.push(`<div class="hm-cell ${lvl?'l'+lvl:''} ${k===todayKey()?'today':''}" title="${k} · ${xp} XP · ${n} activities" onclick="dayModal('${k}')"></div>`);
  }
  return `<div class="heatmap">${cells.join('')}</div>`;
}
function dayModal(k){

    <div class="card">
      <b>📈 Monthly XP progress</b>
      <div class="vbars">${months.map(m=>`<div class="vbar"><span class="vl">${m.xp}</span><div class="col" data-h="${Math.round(m.xp/maxXp*100)}"></div><span class="xl">${m.l}</span></div>`).join('')}</div>
      <div style="height:18px"></div>
      <b>🎚️ Difficulty breakdown (solved)</b><div style="height:12px"></div>
      ${['E','M','H'].map(d=>`<div class="hbar-row"><span class="lbl">${d==='E'?'Easy':d==='M'?'Medium':'Hard'}</span><div class="trk"><i data-w="${Math.round(dc[d]/dTot*100)}" style="background:${colors[d]}"></i></div><span class="val">${dc[d]}</span></div>`).join('')}
    </div>
  </div>
  <div class="sec-title"><h2>🎯 Readiness composition</h2></div>
  <div class="card">${Object.entries(readiness().parts).map(([k,v])=>`<div class="hbar-row"><span class="lbl">${k}</span><div class="trk"><i data-w="${v}" style="background:linear-gradient(90deg,#0EA5E9,var(--blue))"></i></div><span class="val">${v}%</span></div>`).join('')}
  <div style="font-size:12px;color:var(--muted);margin-top:8px">Weighting — Subjects 30% · DSA topics 20% · LeetCode 25% · Consistency 15% · Revision 10%</div></div>`;
}

/* ---------- ACHIEVEMENTS ---------- */
function vAchievements(){
  const unlocked=ACHIEVEMENTS.filter(a=>S.achievements[a.id]);
  return `<div class="card" style="margin-bottom:16px;display:flex;gap:14px;align-items:center">
    <div style="font-size:32px">🏅</div>
    <div><b>${unlocked.length} / ${ACHIEVEMENTS.length} unlocked</b>
    <div style="font-size:12px;color:var(--muted)">Keep studying — locked badges show exactly what to chase next.</div></div></div>
  <div class="grid g2">
    ${ACHIEVEMENTS.map(a=>{ const ts=S.achievements[a.id];
      return `<div class="card ach hoverable ${ts?'unlocked':'locked'}">
        <div class="a-ic">${ts?a.ic:'🔒'}</div>
        <div><h4>${a.n}</h4><p>${a.d}</p>${ts?`<div class="when">Unlocked ${new Date(ts).toLocaleDateString()}</div>`:''}</div></div>`; }).join('')}
  </div>`;
}

/* ---------- SETTINGS ---------- */
function vSettings(){
  return `<div class="card">
    <div class="set-row"><div><h4>📤 Export progress</h4><p>Download all data (topics, problems, XP, notes, calendar) as JSON.</p></div>
      <button class="btn pri" onclick="exportData()">Export JSON</button></div>
    <div class="set-row"><div><h4>📥 Import progress</h4><p>Restore from a previously exported JSON backup.</p></div>
      <button class="btn ghost" onclick="document.getElementById('import-file').click()">Import JSON</button>
      <input type="file" id="import-file" accept=".json,application/json" style="display:none" onchange="importData(this)"></div>
    <div class="set-row"><div><h4>♻️ Local backup mirror <span style="color:var(--accent);font-size:11px;font-weight:800">RECOMMENDED</span></h4><p>Also saves a copy to IndexedDB. If site data is partially cleared, your progress can be recovered automatically on next open.</p></div>
      <div class="switch ${S.settings.idbMirror?'on':''}" onclick="S.settings.idbMirror=!S.settings.idbMirror;save();if(S.settings.idbMirror){idbPut(S);toast('Local backup mirror on','','♻️')}else{toast('Mirror off — export backups manually','','⚠️')};render()"></div></div>
    <div class="set-row"><div><h4>💾 Auto-export backup</h4><p>Silently download a dated JSON backup every ${S.settings.autoExportEvery} milestones (masteries & solves). Best defence against clearing browser data.</p></div>
      <div style="display:flex;gap:8px;align-items:center">
        <select class="searchbox" style="width:auto" title="Backup frequency" onchange="S.settings.autoExportEvery=+this.value;save();render()">
          ${[5,10,15,25,50].map(n=>`<option value="${n}" ${S.settings.autoExportEvery===n?'selected':''}>every ${n}</option>`).join('')}
        </select>
        <div class="switch ${S.settings.autoExport?'on':''}" onclick="S.settings.autoExport=!S.settings.autoExport;saveCount=0;save();toast(S.settings.autoExport?'Auto-export on — first backup after '+S.settings.autoExportEvery+' milestones':'Auto-export off','', S.settings.autoExport?'💾':'⚙️');render()"></div>
      </div></div>
    <div class="set-row"><div><h4>✨ Animations</h4><p>Smooth transitions, shimmer bars, counters & confetti.</p></div>
      <div class="switch ${S.settings.animations?'on':''}" onclick="S.settings.animations=!S.settings.animations;document.body.classList.toggle('anim',S.settings.animations);save();render()"></div></div>
    <div class="set-row"><div><h4>🌙 Theme</h4><p>Premium dark is the default. Light mode is future-proofed here.</p></div>
      <select class="searchbox" style="width:auto" onchange="S.settings.theme=this.value;save();toast(this.value==='dark'?'Dark theme active':'Light theme coming soon — staying dark for now','','🌙')">
        <option value="dark" ${S.settings.theme==='dark'?'selected':''}>Dark (default)</option>
        <option value="light" ${S.settings.theme==='light'?'selected':''}>Light (coming soon)</option></select></div>
    <div class="set-row"><div><h4>🗑️ Reset progress</h4><p>Wipes everything stored in this browser. Cannot be undone.</p></div>
      <button class="btn danger" onclick="resetAll()">Reset</button></div>
  </div>
  <div class="card" style="margin-top:16px;font-size:12.5px;color:var(--muted)">
    <b style="color:var(--text)">ℹ️ About this dashboard</b><br><br>
    The syllabus, 🔥 hot-topic flags, company tags on problems, and the entire <b>Companies</b> section were built by analyzing <b>75 interview-question PDFs</b> shared by the college placement cell — every company from the <b>2025</b> and <b>2026</b> batches. All data lives in your browser's LocalStorage and works fully offline.
  </div>`;
}
function exportData(auto=false){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  const stamp=todayKey()+(auto?'-auto-'+new Date().toISOString().slice(11,16).replace(':',''):'');
  a.download='placeprep-backup-'+stamp+'.json'; a.click(); URL.revokeObjectURL(a.href);
  toast(auto?'Auto-backup saved to your downloads':'Backup exported','', auto?'💾':'📤');
}
function importData(input){
  const f=input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
      const data=JSON.parse(r.result);
      if(typeof data!=='object'||data===null||!('xp' in data)) throw new Error('bad');
      S={...clone(DEFAULT_STATE), ...data, settings:{...DEFAULT_STATE.settings, ...(data.settings||{})}};
      if(!('bonusXp' in data) || !('xpMigrated' in data)) S.xpMigrated=false;  // legacy import → reconcile
      migrateXp(); syncXp();
      save(); document.body.classList.toggle('anim',S.settings.animations);
      toast('Progress imported successfully','','📥'); confetti(); render();
    }catch(e){ toast('Invalid backup file','','⚠️'); } };
  r.readAsText(f); input.value='';
}
function resetAll(){
  openModal(`<h3>⚠️ Reset everything?</h3><div class="m-sub">All XP, statuses, notes, streaks and achievements will be permanently erased.</div>
    <div class="m-actions"><button class="btn ghost" onclick="closeModal()">Cancel</button>
    <button class="btn danger" onclick="S=clone(DEFAULT_STATE);saveCount=0;save();idbPut(S);closeModal();toast('Progress reset','','🗑️');render()">Yes, reset</button></div>`);
}

/* ---------- boot ---------- */
document.body.classList.toggle('anim', S.settings.animations);
migrateXp();   // one-time: reconcile legacy flat XP into derived + bonus (no-op after first run)
syncXp();      // ensure cached S.xp matches current state on every load
addEventListener('resize',()=>{ confettiC.width=innerWidth; confettiC.height=innerHeight; });
/* Restore the route from the URL so refresh / direct links land on the right view. */
route=hashToRoute();
_memStack=[{...route}];                 // initialize in-memory history fallback
safeReplace(route);                     // seed history state for popstate (no-op if API blocked)
render();
/* keep the IDB mirror seeded, and recover if LocalStorage was wiped but IDB survived */
if(S.settings.idbMirror) idbPut(S);
if(typeof recoverFromMirror==='function') recoverFromMirror();
</script>
</body>
</html>
